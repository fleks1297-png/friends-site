<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>История кентов</title>
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f6f3ff;
  color: #444;
  display: flex;
}

.sidebar {
  width: 220px;
  background: #e6dcff;
  padding: 20px;
  height: 100vh;
}

.tab {
  padding: 12px;
  margin-bottom: 10px;
  background: #f3efff;
  border-radius: 10px;
  cursor: pointer;
}

.content {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 20px;
  max-width: 600px;
  width: 100%;
}

.title { font-size: 24px; margin-bottom: 10px; }

.chat-box {
  height: 300px;
  overflow-y: auto;
  border: 1px solid #ddd;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 10px;
  background: #fafafa;
}

.message {
  margin-bottom: 8px;
}

select, input, button {
  padding: 8px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button { cursor: pointer; }

/* mobile */
@media (max-width:768px) {
  body { flex-direction: column; }
  .sidebar { width: 100%; height: auto; display: flex; gap: 5px; overflow-x: auto; }
  .tab { flex: 1; text-align: center; }
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="tab" onclick="showContent('main')">История</div>
  <div class="tab" onclick="showContent('lexa')">Лёха</div>
  <div class="tab" onclick="showContent('vlad')">Влад</div>
  <div class="tab" onclick="showContent('berkut')">Беркут</div>
  <div class="tab" onclick="showContent('sergey')">Серега</div>
  <div class="tab" onclick="showContent('chat')">💬 Чат</div>
</div>

<div class="content" id="content"></div>

<script>
let messages = [];

function showContent(name) {
  const content = document.getElementById('content');

  if (name === 'chat') {
    content.innerHTML = `
      <div class="card">
        <div class="title">Общий чат</div>
        <div class="chat-box" id="chatBox"></div>
        <select id="user">
          <option>Лёха</option>
          <option>Влад</option>
          <option>Беркут</option>
          <option>Серега</option>
        </select><br>
        <input id="msg" placeholder="Сообщение..." />
        <button onclick="sendMessage()">Отправить</button>
      </div>`;
      renderMessages();
      return;
  }

  const texts = {
    main: 'История кентов началась давно...',
    lexa: 'Лёха — спокойный и надежный.',
    vlad: 'Влад — стратег и мыслитель.',
    berkut: 'Беркут — энергия компании.',
    sergey: 'Серега — душа компании.'
  };

  content.innerHTML = `
    <div class="card">
      <div class="title">${name}</div>
      <div>${texts[name]}</div>
    </div>`;
}

function sendMessage() {
  const user = document.getElementById('user').value;
  const msg = document.getElementById('msg').value;
  if (!msg) return;

  messages.push({user, msg});
  document.getElementById('msg').value = '';
  renderMessages();
}

function renderMessages() {
  const box = document.getElementById('chatBox');
  if (!box) return;

  box.innerHTML = messages.map(m => `
    <div class="message"><b>${m.user}:</b> ${m.msg}</div>
  `).join('');
}

showContent('main');
</script>

</body>
</html>
